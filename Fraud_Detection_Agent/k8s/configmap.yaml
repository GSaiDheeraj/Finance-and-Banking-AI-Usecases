apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-config
data:
  # Database configuration
  PGHOST: "postgres-service"
  PGPORT: "5432"
  PGDATABASE: "fraud_detection_db"
  
  # Redis configuration
  REDISHOST: "redis-service"
  REDISPORT: "6379"
  
  # LLM Gateway configuration
  LLM_BASE_URL: "http://llm-gateway-service:8000"
  LLM_MODEL: "gpt-4"
  EMBED_MODEL: "text-embedding-ada-002"
  
  # Application configuration
  LOG_LEVEL: "INFO"
  MAX_UPLOAD_SIZE_MB: "100"
  EMBED_DIM: "1536"
