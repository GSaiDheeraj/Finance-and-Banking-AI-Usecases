# Reference CI/CD pipeline for Investment Research Copilot.
#
# Jobs: lint (ruff), security (bandit), test (pytest), build-and-push (GHCR),
# deploy (kubectl — skips until KUBE_CONFIG secret is set).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Security (bandit)
        run: bandit -r portfolio_monitor/ -ll -q

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: "."
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ needs.build-and-push.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for a configured cluster
        id: cluster-check
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no cluster configured yet)
        if: steps.cluster-check.outputs.configured == 'false'
        run: echo "KUBE_CONFIG secret not set — skipping deploy."

      - name: Set up kubeconfig
        if: steps.cluster-check.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Rolling update (API + worker)
        if: steps.cluster-check.outputs.configured == 'true'
        working-directory: k8s
        run: |
          kubectl apply -f configmap.yaml -f service.yaml -f celery-worker.yaml
          kubectl set image deployment/investment-research-api investment-research-api=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl set image deployment/investment-research-worker worker=${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl rollout status deployment/investment-research-api --timeout=300s
          kubectl rollout status deployment/investment-research-worker --timeout=300s
