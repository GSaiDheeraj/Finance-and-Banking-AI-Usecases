# Non-sensitive runtime configuration for the Investment Research Copilot API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: investment-research-config
  labels:
    app: investment-research-api
data:
  PG_HOST: "postgres.example.internal"
  PG_PORT: "5433"
  PG_DATABASE: "investment_research"

  REDIS_HOST: "redis.example.internal"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  CELERY_REDIS_DB: "1"
  USE_CELERY: "1"

  PM_API_HOST: "0.0.0.0"
  PM_API_PORT: "8000"
  DATA_STORAGE_DIR: "/app/data/uploads"
  PM_LOG_LEVEL: "INFO"
  PM_HISTORY_PERIOD: "1y"
  PM_NEWS_REGION: "wt-wt"
