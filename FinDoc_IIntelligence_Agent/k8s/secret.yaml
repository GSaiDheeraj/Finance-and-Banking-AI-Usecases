apiVersion: v1
kind: Secret
metadata:
  name: findoc-secrets
type: Opaque
stringData:
  # Database credentials (replace with actual values in production)
  PGUSER: "findoc_user"
  PGPASSWORD: "change_me_in_production"
  
  # Redis password (replace with actual values in production)
  REDIS_PASSWORD: "change_me_in_production"
  
  # LLM Gateway API key (replace with actual values in production)
  LLM_API_KEY: "change_me_in_production"
